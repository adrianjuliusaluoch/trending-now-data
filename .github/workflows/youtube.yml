name: Upload Youtube Trending Now Videos to Google BigQuery

on:
  workflow_dispatch:
concurrency:
  group: upload-youtube-bq
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  get_and_upload_market_data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3  # Updated to v3
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: requirements.txt
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Set up Google Cloud credentials
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}' # Replace with the name of your GitHub Actions secret
    - name: Run your script
      uses: nick-fields/retry@v3
      env:
        OPENAI_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      with:
        timeout_minutes: 5
        max_attempts: 3
        retry_wait_seconds: 15
        retry_on: error
        command: jupyter nbconvert --to notebook --execute youtube.ipynb --output executed_youtube.ipynb
